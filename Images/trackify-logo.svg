<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-label="Trackify logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0BA39A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="56" fill="url(#bg)"/>
  <!-- Subtle inner ring for depth -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <!-- Monoline T -->
  <path d="M32 40 H96" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M64 40 V90" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
</svg>

